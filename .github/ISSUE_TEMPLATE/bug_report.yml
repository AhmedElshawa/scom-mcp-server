name: Bug report
description: Report a defect (do not include secrets, tenant IDs or real hostnames)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Redact hostnames, GUIDs, IP addresses, thumbprints and account names. For vulnerabilities use the private reporting in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Setup CLI, Setup wizard, Collector worker, MCP receiver, Entra, Copilot Studio, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact SETUP_* / SCOM_* code if one was shown.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: env
    attributes:
      label: Environment (redacted)
      description: Windows Server version, SCOM version, scope kind, schedule interval.
