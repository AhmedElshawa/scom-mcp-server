name: Offline Windows validation

on:
  pull_request:
  push:
    branches:
      - main
      - aelshawa-microsoft-scom-group-scalability
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-windows:
    name: Windows offline regression and package
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Checkout the exact reviewed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.427'

      - name: Pin SDK selection and record tested identity
        run: |
          $ErrorActionPreference = 'Stop'
          '{"sdk":{"version":"8.0.427","rollForward":"disable","allowPrerelease":false}}' |
            Set-Content -LiteralPath global.json -Encoding utf8NoBOM
          if ((dotnet --version) -ne '8.0.427') { throw 'Unexpected SDK selection.' }
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw 'Checkout does not match the reviewed head.' }
          "Tested commit: $actual" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
          "Runner: $env:ImageOS / $env:ImageVersion; PowerShell: $($PSVersionTable.PSVersion)" |
            Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append
          dotnet --info

      - name: Restore locked dependencies
        run: |
          dotnet restore .\Validation\Validation.csproj --locked-mode --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet restore .\SetupGui\ScomSetup.csproj --runtime win-x64 --locked-mode --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Native setup locked restore failed.' }

      - name: Build with warnings as errors
        run: |
          dotnet build .\Validation\Validation.csproj --configuration Release --no-restore --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Run complete offline PowerShell and C# regression suite
        run: |
          .\validate.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Offline validation failed.' }

      - name: Run complete offline suite under Windows PowerShell 5.1
        run: |
          powershell.exe -NoProfile -File .\validate.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 offline validation failed.' }

      - name: Publish and validate evaluation package
        run: |
          .\package.ps1 -OutputDirectory .\artifacts\ci-evaluation
          .\Validation\Test-Package.ps1 -PackageDirectory .\artifacts\ci-evaluation
          .\Validation\Test-NativeSetup.ps1 -PackageDirectory .\artifacts\ci-evaluation -RunBridgeDiagnostic
          .\Validation\Test-BootstrapSchema.ps1 -PackageDirectory .\artifacts\ci-evaluation
          .\Validation\Test-BootstrapTransport.ps1 -PackageDirectory .\artifacts\ci-evaluation
          .\Validation\Test-LocalPackageSigning.ps1 -PackageDirectory .\artifacts\ci-evaluation -AllowEphemeralCiTrust
          Compress-Archive -LiteralPath .\artifacts\ci-evaluation -DestinationPath .\artifacts\scom-evaluation.zip
          $hash = (Get-FileHash -LiteralPath .\artifacts\scom-evaluation.zip -Algorithm SHA256).Hash
          "$hash  scom-evaluation.zip" | Set-Content -LiteralPath .\artifacts\scom-evaluation.zip.sha256 -Encoding ascii
          "Evaluation ZIP SHA-256: ``$hash``" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Validation changed tracked source.' }
          "Offline build, full regression suite and evaluation package checks passed. No live SCOM/customer acceptance." |
            Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append

      - name: Retain evaluation package for this commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/scom-evaluation.zip
            artifacts/scom-evaluation.zip.sha256
          if-no-files-found: error
          retention-days: 7
